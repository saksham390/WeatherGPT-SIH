services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - weathergpt-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: weathergpt
      DATABASE_USERNAME: weathergpt
      DATABASE_PASSWORD: weathergpt
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  weathergpt-postgres:
